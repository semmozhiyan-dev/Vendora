services:
  mongodb:
    image: mongo:latest
    container_name: vendora-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: vendora
    volumes:
      - mongodb_data:/data/db

    networks:
      - vendora-network
      - monitoring-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendora-backend
    env_file:
      - ./.env
    expose:
      - "8000"
    environment:
      NODE_ENV: production
      PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      API_URL: ${API_URL:-http://localhost:8000}
    networks:
      - vendora-network
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: vendora-node-exporter
    profiles: ["monitoring"]
    command:
      - --path.rootfs=/host
    ports:
      - "9100:9100"
    volumes:
      - /:/host:ro,rslave
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks:
      - monitoring-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: vendora-cadvisor
    profiles: ["monitoring"]
    privileged: true
    user: root
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /var/run/docker.sock:/var/run/docker.sock:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring-network
    restart: unless-stopped
  docker-exporter:
    image: wywywywy/docker_stats_exporter:latest
    container_name: vendora-docker-exporter
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9487:9487"
    networks:
      - monitoring-network
    restart: unless-stopped
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.1.0
    container_name: vendora-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx/stub_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx
    networks:
      - monitoring-network
      - vendora-network
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: vendora-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - node-exporter
      - cadvisor
      - docker-exporter
    networks:
      - monitoring-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:11.2.0
    container_name: vendora-grafana
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: https://grafana.vendore.tech
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vendora-frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - vendora-network
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: vendora-nginx:latest
    container_name: vendora-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.example:/etc/nginx/nginx.conf:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    networks:
      - monitoring-network
      - vendora-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local
  prometheus-data:
  grafana-data:

networks:
  vendora-network:
    driver: bridge
  monitoring-network:
    driver: bridge
