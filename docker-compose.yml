services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendora-backend
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_URL: ${DB_URL:-mongodb://admin:admin123@localhost:27017/vendora?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      REQUEST_TIMEOUT_MS: 10000
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: http://frontend
    networks:
      - vendora-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vendora-frontend
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - vendora-network
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: vendora-nginx:latest
    container_name: vendora-nginx
    ports:
      - "80:80"
    volumes:
      - /home/semmozhiyan/.config/Vendora/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - vendora-network
    restart: unless-stopped

networks:
  vendora-network:
    driver: bridge

