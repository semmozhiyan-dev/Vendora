services:
  mongodb:
    image: mongo:latest
    container_name: vendora-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: vendora
    volumes:
      - mongodb_data:/data/db
    networks:
      - vendora-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vendora-backend
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_URL: mongodb://admin:admin123@mongodb:27017/vendora?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-supersecret}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      REQUEST_TIMEOUT_MS: 10000
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      FRONTEND_URL: http://frontend
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - vendora-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vendora-frontend
    expose:
      - "80"
    environment:
      VITE_API_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - vendora-network
    restart: unless-stopped

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: vendora-nginx:latest
    container_name: vendora-nginx
    ports:
      - "80:80"
    volumes:
      - /home/semmozhiyan/.config/Vendora/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - vendora-network
    restart: unless-stopped

volumes:
  mongodb_data:
    driver: local

networks:
  vendora-network:
    driver: bridge

